<div class="min-h-screen flex flex-col bg-slate-50 text-slate-900">
  <!-- Top Navigation Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-2xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <!-- Brand / Logo -->
      <div class="flex items-center gap-8">
        <a routerLink="/" class="flex items-center gap-2.5 font-bold text-lg text-slate-900 tracking-tight">
          <span class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center text-sm font-black shadow-xs">
            PH
          </span>
          <span>Problem <span class="text-indigo-600">Hub</span></span>
        </a>

        <!-- Navigation Links -->
        <nav class="hidden md:flex items-center gap-1 text-sm font-medium">
          <a routerLink="/problems" routerLinkActive="bg-slate-100 text-indigo-600 font-semibold" class="px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition-colors">
            Browse Problems
          </a>
          <a *ngIf="auth.isLoggedIn()" routerLink="/bookmarks" routerLinkActive="bg-slate-100 text-indigo-600 font-semibold" class="px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition-colors flex items-center gap-1.5">
            <svg class="w-4 h-4 text-indigo-600" fill="currentColor" viewBox="0 0 24 24"><path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>
            Shortlist
          </a>
        </nav>
      </div>

      <!-- Right User / Auth Actions -->
      <div class="flex items-center gap-3 text-sm">
        <!-- If Logged In -->
        <ng-container *ngIf="auth.isLoggedIn(); else guestActions">
          <a *ngIf="auth.isAdmin()" routerLink="/admin" routerLinkActive="bg-indigo-50 border-indigo-200 text-indigo-700" class="text-xs font-semibold px-2.5 py-1 rounded-md border border-slate-200 text-slate-700 hover:bg-slate-50">
            Admin Console
          </a>

          <div class="flex items-center gap-2 pl-2 border-l border-slate-200">
            <div class="text-right hidden sm:block">
              <span class="block text-xs font-bold text-slate-800 leading-tight">{{ auth.currentUser()?.name }}</span>
              <span class="block text-[10px] text-slate-400 font-semibold uppercase">{{ auth.currentUser()?.role }}</span>
            </div>
            <button
              (click)="auth.logout()"
              class="px-3 py-1.5 text-xs text-slate-600 hover:text-rose-600 hover:bg-slate-50 rounded-md transition-colors font-medium">
              Sign Out
            </button>
          </div>
        </ng-container>

        <!-- If Logged Out -->
        <ng-template #guestActions>
          <a routerLink="/auth/login" class="text-slate-600 hover:text-slate-900 font-medium px-3 py-1.5 text-xs sm:text-sm">
            Sign In
          </a>
          <a routerLink="/auth/register" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-3.5 py-1.5 rounded-md shadow-xs transition-colors text-xs sm:text-sm">
            Get Started
          </a>
        </ng-template>
      </div>
    </div>
  </header>

  <!-- Main View Area -->
  <main class="flex-1">
    <router-outlet></router-outlet>
  </main>

  <!-- Minimal Footer -->
  <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
      <p><span class="font-semibold text-slate-700">Problem Hub</span> — Discover · Understand · Filter · Shortlist · Build</p>
      <p class="text-slate-400">Java Full-Stack (Spring Boot + Spring JDBC + MySQL + Angular)</p>
    </div>
  </footer>
</div>
